[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[all]>=0.135.1",
    "bcrypt>=4.0.0",
    "pyjwt>=2.10.1",
    "python-dotenv>=1.1.0",
    "psycopg[binary]>=3.2.0",
    "requests>=2.32.0",
    "sqlalchemy>=2.0.48",
    "uvicorn>=0.41.0",
    "resend>=2.29.0",
    "boto3>=1.35.0",
    "numpy>=1.26.0",
]

[tool.mypy]
plugins = ["pydantic.mypy"]
explicit_package_bases = true
ignore_missing_imports = true
strict = true

[tool.ruff]
# Target version matches your project python requirement
target-version = "py313"
line-length = 88

[tool.ruff.lint]
# Rules configured for a robust FastAPI relational DB setup
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes (catches unused imports, undefined variables)
    "I",   # isort (automatically sorts imports cleanly)
    "B",   # flake8-bugbear (catches design flaws, e.g., mutable defaults in routes)
    "UP",  # pyupgrade (upgrades code to modern Python 3.13+ syntax)
    "ASYNC", # flake8-async (ensures async endpoints are written correctly)
]
ignore = []

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are meant to be used as argument defaults
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Body",
]

# Protect Alembic migrations from being aggressively cleaned up by the linter
[tool.ruff.lint.per-file-ignores]
"alembic/**/*.py" = ["E501"]

[tool.ruff.format]
# Enforce clean formatting across the codebase
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
